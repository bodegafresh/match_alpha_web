<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#060d17">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Match Alpha</title>
  <meta name="description" content="Dashboard deportivo multi-competencia: partidos, posiciones, equipos, torneo y métricas del modelo.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=20261007f41">
  <link rel="stylesheet" href="css/picks.css?v=20261007f41">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">MA</div>
      <div>
        <h1>Match Alpha</h1>
        <button class="league-picker-btn" id="league-picker-btn" aria-haspopup="listbox" aria-expanded="false">
          <span id="league-picker-label">Mundial FIFA 2026</span>
          <span class="league-picker-chevron" aria-hidden="true">▾</span>
        </button>
      </div>
    </div>
    <div class="league-picker-dropdown" id="league-picker-dropdown" role="listbox" aria-label="Seleccionar competición" hidden></div>
    <nav class="tabs" aria-label="Secciones" role="tablist">
      <button class="tab active" data-view="today" id="tab-today" type="button" role="tab" aria-controls="view-root" aria-selected="true">Partidos</button>
      <button class="tab" data-view="standings" id="tab-standings" type="button" role="tab" aria-controls="view-root" aria-selected="false">Posiciones</button>
      <button class="tab" data-view="teams" id="tab-teams" type="button" role="tab" aria-controls="view-root" aria-selected="false">Equipos</button>
      <button class="tab" data-view="tournament" id="tab-tournament" type="button" role="tab" aria-controls="view-root" aria-selected="false">Torneo</button>
      <button class="tab" data-view="news" id="tab-news" type="button" role="tab" aria-controls="view-root" aria-selected="false">Noticias</button>
      <button class="tab" data-view="elo" id="tab-elo" type="button" role="tab" aria-controls="view-root" aria-selected="false">ELO</button>
      <button class="tab tab--quant" data-view="ev" id="tab-ev" type="button" role="tab" aria-controls="view-root" aria-selected="false">Valor</button>
      <button class="tab tab--quant" data-view="model" id="tab-model" type="button" role="tab" aria-controls="view-root" aria-selected="false">Modelo</button>
      <button class="tab tab--quant" data-view="stats" id="tab-stats" type="button" role="tab" aria-controls="view-root" aria-selected="false">Stats</button>
    </nav>
  </header>

  <div id="offline-banner" class="offline-banner" role="status" hidden>Sin conexión — mostrando último dato</div>

  <main class="shell">
    <section id="status-strip" class="status-strip">
      <span id="status-text"></span>
      <label class="lang-select"><span class="sr-only">Idioma</span>
        <select id="lang-select" aria-label="Idioma">
          <option value="es">ES</option><option value="en">EN</option><option value="pt">PT</option>
        </select>
      </label>
      <button id="refresh-btn" class="icon-btn" type="button" title="Actualizar" aria-label="Actualizar"><span aria-hidden="true">↻</span></button>
    </section>
    <div id="date-filter-bar" hidden></div>
    <section id="view-root" class="view-root" role="tabpanel" aria-labelledby="tab-today"></section>
  </main>

  <nav class="bottom-nav" aria-label="Navegación principal">
    <button class="bottom-tab" data-view="today" type="button"><span class="bottom-tab-icon" aria-hidden="true">⚽</span><span>Partidos</span></button>
    <button class="bottom-tab" data-view="standings" type="button"><span class="bottom-tab-icon" aria-hidden="true">☰</span><span>Tablas</span></button>
    <button class="bottom-tab" data-view="teams" type="button"><span class="bottom-tab-icon" aria-hidden="true">⛨</span><span>Equipos</span></button>
    <button class="bottom-tab" data-view="ev" type="button"><span class="bottom-tab-icon" aria-hidden="true">◎</span><span>Valor</span></button>
    <button class="bottom-tab" data-more type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="more-sheet"><span class="bottom-tab-icon" aria-hidden="true">⋯</span><span>Más</span></button>
  </nav>
  <div class="sheet-backdrop" id="more-backdrop" hidden></div>
  <div class="more-sheet" id="more-sheet" role="dialog" aria-label="Más secciones" hidden>
    <span class="sheet-grabber" aria-hidden="true"></span>
    <button class="more-item" data-view="tournament" type="button"><span aria-hidden="true">🏆</span>Torneo</button>
    <button class="more-item" data-view="news" type="button"><span aria-hidden="true">📰</span>Noticias</button>
    <button class="more-item" data-view="elo" type="button"><span aria-hidden="true">📈</span>ELO</button>
    <button class="more-item" data-view="model" type="button"><span aria-hidden="true">🧠</span>Modelo</button>
    <button class="more-item" data-view="stats" type="button"><span aria-hidden="true">📊</span>Stats</button>
    <button class="more-item" data-view="picks-history" type="button"><span aria-hidden="true">🧾</span>Historial</button>
    <button class="more-item" data-view="alerts" type="button"><span aria-hidden="true">🔔</span>Alertas</button>
  </div>

  <template id="login-template">
    <form class="login-box" id="login-form">
      <h2>Acceso</h2>
      <p>Ingresa la clave de lectura (solo consulta) para acceder a la API del proyecto. Nunca uses aquí la clave interna.</p>
      <label for="api-key-input" class="sr-only">Clave de lectura</label>
      <input id="api-key-input" type="password" placeholder="Clave de lectura" autocomplete="off">
      <button type="submit">Entrar</button>
      <small id="login-error"></small>
    </form>
  </template>

  <script src="js/config.js?v=20261007f41"></script>
  <script src="js/i18n-dict.js?v=20261007f41"></script>
  <script src="js/i18n.js?v=20261007f41"></script>
  <!-- Chart.js is lazy-loaded by js/app.js (loadChartJs) only when the Stats view opens. -->
  <script src="js/team-identity.js?v=20261007f41"></script>
  <script src="js/stats-insights.js?v=20261007f41"></script>
  <script src="js/probabilities.js?v=20261007f41"></script>
  <script src="js/app.js?v=20261007f41"></script>
  <!-- Fase H: historial de picks, alertas push, aviso legal (views registered in window.MA_VIEWS) -->
  <script src="js/csv.js?v=20261007f41"></script>
  <script src="js/picks.js?v=20261007f41"></script>
  <script src="js/push.js?v=20261007f41"></script>
  <script src="js/legal.js?v=20261007f41"></script>
</body>
</html>
